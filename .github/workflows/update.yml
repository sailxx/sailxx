name: Update cards
on:
  schedule:
    - cron: "7/10 * * * *"
  push:
    branches: [main]
    paths:
      - README.md
      - build.mjs
      - kit.mjs
      - hero-char.txt
      - logos.mjs
      - logos-src/**
      - .fontsrc/**
      - package*.json
      - .github/workflows/update.yml
  workflow_dispatch:
concurrency: update-profile-cards
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node build.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || (git commit -m "Update profile cards" && git push)
