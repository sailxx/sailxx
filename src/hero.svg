<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320" role="img" aria-label="Vlad (sailxx): I build useful products">
<style>
{{FONT}}
text{font-family:"JBM",ui-monospace,Consolas,monospace}
.r{animation:in .8s cubic-bezier(.2,.8,.2,1) backwards}
.d1{animation-delay:.1s}.d2{animation-delay:.25s}.d3{animation-delay:.4s}.d4{animation-delay:.55s}.d5{animation-delay:.7s}.d6{animation-delay:.85s}.d7{animation-delay:1s}.d8{animation-delay:1.15s}
.caret{animation:blink 1.05s steps(1) infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.draw{stroke-dasharray:1400;animation:draw 3s cubic-bezier(.4,0,.2,1) .2s backwards}
@keyframes draw{from{stroke-dashoffset:1400;fill-opacity:0}}
.sh{animation:sh 5s linear infinite}
@keyframes sh{from{transform:translateX(-300px)}to{transform:translateX(1000px)}}
@media (prefers-reduced-motion:reduce){.r,.pulse,.draw,.sh{animation:none}}
</style>
<defs>
  <linearGradient id="ink" x1="0" y1="0" x2="880" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#c4b5fd"/><stop offset=".5" stop-color="#f0abfc"/><stop offset="1" stop-color="#7dd3fc"/></linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="200" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(440 330) scale(520 200)"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".35"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
  <clipPath id="k"><rect width="880" height="320" rx="22"/></clipPath>
  <mask id="wm"><text x="440" y="318" text-anchor="middle" font-size="196" font-weight="800" letter-spacing="-6" fill="#fff">SAILXX</text></mask>
</defs>
<g clip-path="url(#k)">
  <rect width="880" height="320" fill="#0a0a12"/>
  <rect width="880" height="320" fill="url(#glow)"/>
  <text class="draw" x="440" y="318" text-anchor="middle" font-size="196" font-weight="800" letter-spacing="-6" fill="url(#ink)" fill-opacity=".9" stroke="url(#ink)" stroke-width="1.5">SAILXX</text>
  <g mask="url(#wm)"><rect class="sh" x="0" y="150" width="200" height="200" fill="url(#shine)"/></g>
</g>
<rect x=".5" y=".5" width="879" height="319" rx="21.5" fill="none" stroke="#fff" stroke-opacity=".08"/>
<g class="r d1"><circle class="pulse" cx="48" cy="52" r="4" fill="#4ade80"/><text x="62" y="56" font-size="11" font-weight="700" letter-spacing="2.4" fill="#8b8fb0">VLAD · 16 Y/O FOUNDER · RUSSIA</text></g>
<text class="r d2" x="44" y="104" font-size="34" font-weight="800" letter-spacing="-1" fill="#f4f5ff">I build <tspan fill="url(#ink)">useful products.</tspan></text>
<text class="r d3" x="44" y="134" font-size="14" fill="#a3a6c4">AI bots, Android apps and minimal tools — idea → release.</text>
<g class="r d4" font-size="11" font-weight="700" letter-spacing="2" text-anchor="end"><text x="836" y="56" fill="#6e7193">5 APPS · 3 PLATFORMS</text><text x="836" y="78" fill="#c4b5fd">OKTO 2.8 · ANDROID</text><text x="836" y="100" fill="#7dd3fc">@ARKHITKOVV</text></g>
</svg>
