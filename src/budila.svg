<svg xmlns="http://www.w3.org/2000/svg" width="430" height="290" viewBox="0 0 430 290" role="img" aria-label="Budila: a calm alarm clock for Android, no ads, offline, 17 themes">
<style>
{{FONT}}
text{font-family:"JBM",ui-monospace,Consolas,monospace}
.row{font-size:12.5px;fill:#5c5e71}
.mk{fill:#4c5c92;font-weight:700}
.th{animation:on .5s cubic-bezier(.2,.8,.2,1) .5s backwards}
@keyframes on{from{transform:translateX(-10px)}}
.tr{animation:tr .5s ease .5s backwards}
@keyframes tr{from{fill:#c6c6d0}}
.pl{transform-box:fill-box;transform-origin:center;animation:pl 1.6s ease-out infinite}
@keyframes pl{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
@media (prefers-reduced-motion:reduce){.th,.tr,.pl{animation:none}}
</style>
<rect x=".5" y=".5" width="429" height="289" rx="19.5" fill="#f4f3fa" stroke="#e2e1ec"/>

<text x="28" y="44" font-size="11" font-weight="600" letter-spacing="2.4" fill="#5c5e71">ANDROID · ALARM</text>
<text x="28" y="88" font-size="38" font-weight="800" letter-spacing="-1.2" fill="#4c5c92">Budila</text>
<text font-size="14" font-weight="500" fill="#1b1b21"><tspan x="28" y="118">Wake up on time.</tspan><tspan x="28" y="138">Get up gently.</tspan></text>

<g transform="translate(286 52)">
  <rect width="120" height="70" rx="12" fill="#ffffff" stroke="#d9d9e6"/>
  <circle class="pl" cx="14" cy="16" r="3" fill="none" stroke="#4c5c92" stroke-width="1.2"/>
  <circle cx="14" cy="16" r="3" fill="#4c5c92"/>
  <text x="22" y="19" font-size="8" font-weight="700" letter-spacing="1.4" fill="#5c5e71">NEXT ALARM</text>
  <text x="10" y="46" font-size="24" font-weight="700" letter-spacing="-1" fill="#1b1b21">07:30</text>
  <rect class="tr" x="84" y="30" width="26" height="16" rx="8" fill="#4c5c92"/>
  <circle class="th" cx="102" cy="38" r="5.5" fill="#ffffff"/>
  <text x="10" y="60" font-size="8" font-weight="500" fill="#5c5e71">Mon–Fri · Work</text>
</g>

<text class="row" x="28" y="176"><tspan class="mk">› </tspan>no ads · offline · 1.9 MB</text>
<text class="row" x="28" y="198"><tspan class="mk">› </tspan>gentle wake-up · tags · 17 themes</text>
<text class="row" x="28" y="220"><tspan class="mk">› </tspan>Kotlin · Compose · 10 languages</text>

<rect x="28" y="240" width="218" height="28" rx="14" fill="#4c5c92"/>
<text x="44" y="258" font-size="12" font-weight="700" fill="#ffffff">▶ github.com/sailxx/Budila</text>
</svg>
