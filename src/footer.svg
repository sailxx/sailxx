<svg xmlns="http://www.w3.org/2000/svg" width="880" height="96" viewBox="0 0 880 96" role="img" aria-label="Say hi on Telegram: @arkhitkovv">
<style>
{{FONT}}
text{font-family:"JBM",ui-monospace,Consolas,monospace}
.draw{stroke-dasharray:1600;animation:draw 3s cubic-bezier(.4,0,.2,1) .2s backwards}
@keyframes draw{from{stroke-dashoffset:1600;fill-opacity:0}}
.sh{animation:sh 5s linear 1s infinite}
@keyframes sh{from{transform:translateX(-300px)}to{transform:translateX(1000px)}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.arr{animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.draw,.sh,.pulse,.arr{animation:none}}
</style>
<defs>
  <linearGradient id="ink" x1="0" y1="0" x2="880" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#c4b5fd"/><stop offset=".5" stop-color="#f0abfc"/><stop offset="1" stop-color="#7dd3fc"/></linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="200" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(440 106) scale(520 67.19999999999999)"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".32"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
  <clipPath id="k"><rect width="880" height="96" rx="22"/></clipPath>
  <mask id="wm"><text fill="#fff" x="44" y="61" font-size="36" font-weight="800" letter-spacing="-1.2">@arkhitkovv</text></mask>
</defs>
<g clip-path="url(#k)">
  <rect width="880" height="96" fill="#0a0a12"/>
  <rect width="880" height="96" fill="url(#glow)"/>
  <text class="draw" fill="url(#ink)" fill-opacity=".9" stroke="url(#ink)" stroke-width="1.2" x="44" y="61" font-size="36" font-weight="800" letter-spacing="-1.2">@arkhitkovv</text>
  <g mask="url(#wm)"><rect class="sh" x="0" y="0" width="200" height="96" fill="url(#shine)"/></g>
</g>
<rect x=".5" y=".5" width="879" height="95" rx="21.5" fill="none" stroke="#fff" stroke-opacity=".08"/>
<line x1="600" y1="22" x2="600" y2="74" stroke="#fff" stroke-opacity=".08"/><text x="624" y="34" font-size="11" font-weight="700" letter-spacing="2.4" fill="#6e7193">SAY HI</text><text x="624" y="53" font-size="13" font-weight="600" fill="#eceefe">DMs are open</text><text x="624" y="72" font-size="11" font-weight="700" letter-spacing="2" fill="#7dd3fc">T.ME/ARKHITKOVV</text><text class="arr" x="762" y="72" font-size="12" font-weight="700" fill="#7dd3fc">→</text>
</svg>