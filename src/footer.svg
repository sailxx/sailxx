<svg xmlns="http://www.w3.org/2000/svg" width="880" height="170" viewBox="0 0 880 170" role="img" aria-label="Say hi on Telegram: @arkhitkovv">
<style>
{{FONT}}
text{font-family:"JBM",ui-monospace,Consolas,monospace}
.draw{stroke-dasharray:2400;animation:draw 3s cubic-bezier(.4,0,.2,1) .2s backwards}
@keyframes draw{from{stroke-dashoffset:2400;fill-opacity:0}}
.sh{animation:sh 5s linear 1s infinite}
@keyframes sh{from{transform:translateX(-300px)}to{transform:translateX(1000px)}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.arr{animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.draw,.sh,.pulse,.arr{animation:none}}
</style>
<defs>
  <linearGradient id="ink" x1="0" y1="0" x2="880" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#c4b5fd"/><stop offset=".5" stop-color="#f0abfc"/><stop offset="1" stop-color="#7dd3fc"/></linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="200" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(440 180) scale(520 120)"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".35"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
  <clipPath id="k"><rect width="880" height="170" rx="22"/></clipPath>
  <mask id="wm"><text x="440" y="168" text-anchor="middle" font-size="128" font-weight="800" letter-spacing="-4" fill="#fff">@ARKHITKOVV</text></mask>
</defs>
<g clip-path="url(#k)">
  <rect width="880" height="170" fill="#0a0a12"/>
  <rect width="880" height="170" fill="url(#glow)"/>
  <text class="draw" x="440" y="168" text-anchor="middle" font-size="128" font-weight="800" letter-spacing="-4" fill="url(#ink)" fill-opacity=".9" stroke="url(#ink)" stroke-width="1.5">@ARKHITKOVV</text>
  <g mask="url(#wm)"><rect class="sh" x="0" y="60" width="200" height="120" fill="url(#shine)"/></g>
</g>
<rect x=".5" y=".5" width="879" height="169" rx="21.5" fill="none" stroke="#fff" stroke-opacity=".08"/>
<circle class="pulse" cx="48" cy="38" r="4" fill="#4ade80"/>
<text x="62" y="42" font-size="11" font-weight="700" letter-spacing="2.4" fill="#8b8fb0">SAY HI · ON TELEGRAM</text>
<text x="814" y="42" text-anchor="end" font-size="11" font-weight="700" letter-spacing="2" fill="#7dd3fc">T.ME/ARKHITKOVV</text>
<text class="arr" x="822" y="42" font-size="12" font-weight="700" fill="#7dd3fc">→</text>
</svg>
