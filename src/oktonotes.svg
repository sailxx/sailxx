<svg xmlns="http://www.w3.org/2000/svg" width="430" height="290" viewBox="0 0 430 290" role="img" aria-label="Okto Notes: notes and journal for Android with mood tracking and streaks, offline, zero permissions">
<style>
{{FONT}}
text{font-family:"JBM",ui-monospace,Consolas,monospace}
.row{font-size:12.5px;fill:#49454f}
.mk{fill:#4a2fc0;font-weight:700}
.m{transform-box:fill-box;transform-origin:bottom;animation:up .7s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes up{from{transform:scaleY(0)}}
@media (prefers-reduced-motion:reduce){.m{animation:none}}
</style>
<rect x=".5" y=".5" width="429" height="289" rx="19.5" fill="#f7f2fa" stroke="#e4daee"/>

<text x="28" y="44" font-size="11" font-weight="600" letter-spacing="2.4" fill="#49454f">ANDROID · NOTES</text>
<text x="28" y="88" font-size="38" font-weight="800" letter-spacing="-1.2" fill="#4a2fc0">Okto Notes</text>
<text font-size="14" font-weight="500" fill="#1d1b20"><tspan x="28" y="118">Notes &amp; a daily journal</tspan><tspan x="28" y="138">with mood and streaks.</tspan></text>

<g transform="translate(286 52)">
  <rect width="120" height="70" rx="12" fill="#ffffff" stroke="#e4daee"/>
  <text x="10" y="19" font-size="8" font-weight="700" letter-spacing="1.4" fill="#49454f">STREAK</text>
  <text x="110" y="19" text-anchor="end" font-size="8" font-weight="700" fill="#4a2fc0">12 days</text>
  <g>
    <rect class="m" style="animation-delay:.30s" x="12" y="44" width="10" height="16" rx="3" fill="#e8deff"/>
    <rect class="m" style="animation-delay:.38s" x="26" y="36" width="10" height="24" rx="3" fill="#ffd8e4"/>
    <rect class="m" style="animation-delay:.46s" x="40" y="40" width="10" height="20" rx="3" fill="#d7f5e1"/>
    <rect class="m" style="animation-delay:.54s" x="54" y="30" width="10" height="30" rx="3" fill="#e8deff"/>
    <rect class="m" style="animation-delay:.62s" x="68" y="34" width="10" height="26" rx="3" fill="#ffd8e4"/>
    <rect class="m" style="animation-delay:.70s" x="82" y="28" width="10" height="32" rx="3" fill="#d7f5e1"/>
    <rect class="m" style="animation-delay:.78s" x="96" y="26" width="10" height="34" rx="3" fill="#4a2fc0"/>
  </g>
</g>

<text class="row" x="28" y="176"><tspan class="mk">› </tspan>0 permissions · offline · no ads</text>
<text class="row" x="28" y="198"><tspan class="mk">› </tspan>mood · daily streaks · photos</text>
<text class="row" x="28" y="220"><tspan class="mk">› </tspan>Kotlin · Compose · 3 themes</text>

<rect x="28" y="240" width="254" height="28" rx="14" fill="#4a2fc0"/>
<text x="44" y="258" font-size="12" font-weight="700" fill="#ffffff">▶ github.com/sailxx/Okto-Notes</text>
</svg>
