<svg xmlns="http://www.w3.org/2000/svg" width="430" height="290" viewBox="0 0 430 290" role="img" aria-label="All apps in one place: sailxx.github.io">
<style>
{{FONT}}
text{font-family:"JBM",ui-monospace,Consolas,monospace}
.row{font-size:12.5px;fill:#a3a6c4}
.mk{fill:#a78bfa;font-weight:700}
.t{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.2,.8,.2,1.3) backwards}
@keyframes pop{from{opacity:0;transform:scale(.5)}}
@media (prefers-reduced-motion:reduce){.t{animation:none}}
</style>
<defs>
  <radialGradient id="g" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(430 0) scale(280 240)"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".28"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
  <linearGradient id="ink" x1="28" y1="0" x2="230" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#7dd3fc"/></linearGradient>
  <clipPath id="c"><rect width="430" height="290" rx="20"/></clipPath>
</defs>
<g clip-path="url(#c)"><rect width="430" height="290" fill="#0c0d16"/><rect width="430" height="290" fill="url(#g)"/></g>
<rect x=".5" y=".5" width="429" height="289" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>

<text x="28" y="44" font-size="11" font-weight="600" letter-spacing="2.4" fill="#8b8fb0">HOME · ALL APPS</text>
<text x="28" y="88" font-size="38" font-weight="800" letter-spacing="-1.2" fill="url(#ink)">All apps</text>
<text font-size="14" font-weight="500" fill="#eceefe"><tspan x="28" y="118">Everything I ship,</tspan><tspan x="28" y="138">in one place.</tspan></text>

<g transform="translate(306 46)">
  <rect class="t" style="animation-delay:.20s" x="0"  y="0"  width="26" height="26" rx="8" fill="#c9f36b"/>
  <g class="t" style="animation-delay:.28s"><rect x="34" y="0" width="26" height="26" rx="8" fill="#f3f3f1"/><circle cx="47" cy="13" r="3.5" fill="#d33a3f"/></g>
  <rect class="t" style="animation-delay:.36s" x="68" y="0"  width="26" height="26" rx="8" fill="#4a2fc0"/>
  <rect class="t" style="animation-delay:.44s" x="0"  y="34" width="26" height="26" rx="8" fill="#4c5c92"/>
  <rect class="t" style="animation-delay:.52s" x="34" y="34" width="26" height="26" rx="8" fill="#4cc2ff"/>
  <g class="t" style="animation-delay:.60s"><rect x="68.5" y="34.5" width="25" height="25" rx="7.5" fill="none" stroke="#6e7193" stroke-dasharray="3 3"/><path d="M81 41.5v11M75.5 47h11" stroke="#a3a6c4" stroke-width="1.6" stroke-linecap="round"/></g>
</g>

<text class="row" x="28" y="176"><tspan class="mk">› </tspan>Okto · Notes · Budila</text>
<text class="row" x="28" y="198"><tspan class="mk">› </tspan>FITTER · TrayMixer</text>
<text class="row" x="28" y="220"><tspan class="mk">› </tspan>web · Android · Windows 11</text>

<rect x="28" y="240" width="182" height="28" rx="14" fill="url(#ink)"/>
<text x="44" y="258" font-size="12" font-weight="700" fill="#0c0d16">▶ sailxx.github.io</text>
</svg>
