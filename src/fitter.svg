<svg xmlns="http://www.w3.org/2000/svg" width="430" height="290" viewBox="0 0 430 290" role="img" aria-label="FITTER: snap a meal and AI counts calories and macros in Telegram">
<style>
{{FONT}}
text{font-family:"JBM",ui-monospace,Consolas,monospace}
.row{font-size:12.5px;fill:#a3a6b8}
.mk{fill:#c9f36b;font-weight:700}
.arc{stroke-dasharray:214;stroke-dashoffset:64;animation:fill 1.6s cubic-bezier(.2,.8,.2,1) .3s backwards}
@keyframes fill{from{stroke-dashoffset:214}}
@media (prefers-reduced-motion:reduce){.arc{animation:none}}
</style>
<defs>
  <radialGradient id="g" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(430 0) scale(260 220)"><stop offset="0" stop-color="#c9f36b" stop-opacity=".13"/><stop offset="1" stop-color="#c9f36b" stop-opacity="0"/></radialGradient>
  <clipPath id="c"><rect width="430" height="290" rx="20"/></clipPath>
</defs>
<g clip-path="url(#c)"><rect width="430" height="290" fill="#14151d"/><rect width="430" height="290" fill="url(#g)"/></g>
<rect x=".5" y=".5" width="429" height="289" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity=".07"/>

<text x="28" y="44" font-size="11" font-weight="600" letter-spacing="2.4" fill="#8b8fa3">TELEGRAM BOT · AI</text>
<text x="28" y="88" font-size="38" font-weight="800" letter-spacing="-1.2" fill="#c9f36b">FITTER</text>
<text font-size="14" font-weight="500" fill="#eef0f6"><tspan x="28" y="118">Snap a meal, AI counts</tspan><tspan x="28" y="138">calories &amp; macros.</tspan></text>

<g transform="translate(356 92)">
  <circle r="34" fill="none" stroke="#262833" stroke-width="9"/>
  <circle class="arc" r="34" fill="none" stroke="#c9f36b" stroke-width="9" stroke-linecap="round" transform="rotate(-90)"/>
  <text y="4" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#8b8fa3">KCAL</text>
</g>

<text class="row" x="28" y="176"><tspan class="mk">› </tspan>photo · text · barcode</text>
<text class="row" x="28" y="198"><tspan class="mk">› </tspan>Mini App diary · AI assistant</text>
<text class="row" x="28" y="220"><tspan class="mk">› </tspan>10 languages · Workers · Gemini</text>

<rect x="28" y="240" width="190" height="28" rx="14" fill="#c9f36b"/>
<text x="44" y="258" font-size="12" font-weight="700" fill="#14151d">▶ t.me/FitterFoodBot</text>
</svg>
